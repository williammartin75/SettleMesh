openapi: 3.1.0
info:
  title: SettleMesh Validation and Identity API
  version: 1.2.0-pilot
  description: >-
    API pilote authentifiée de prévalidation UBL/CII. Elle n'est pas une certification
    juridique, ne conserve pas les factures et nécessite encore une infrastructure de
    secrets, TLS et audit persistants avant une exposition Internet. Les routes
    d'identité VIES et Peppol ne persistent pas les identifiants ni leurs réponses.

    Les clés proviennent de deux sources équivalentes : la variable SETTLEMESH_API_KEYS
    (mémoire du processus) ou un fichier de registre pointé par SETTLEMESH_REGISTRY_FILE
    (schéma settlemesh-registry-1 : hashes SHA-256 uniquement, rôles owner/admin/viewer,
    révocation via revokedAt, quotas par organisation). Le fichier de registre est relu à
    chaud : une révocation prend effet sans redémarrage et répond 401 API_KEY_REVOKED.
    La réponse de validation porte le rôle résolu côté serveur sous organizationRole.
servers:
  - url: http://127.0.0.1:4173/api/v1
    description: Serveur local
paths:
  /health:
    get:
      operationId: getHealth
      summary: État et versions des validateurs
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/ApiError'
  /validate:
    post:
      operationId: validateInvoice
      summary: Prévalider une facture XML UBL ou CII
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Facture analysée, même si le résultat métier est blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '405':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /auth/login:
    post:
      operationId: loginMember
      summary: Connecter un membre humain (cookie de session durci)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session créée ; cookie settlemesh_session HttpOnly/SameSite=Lax, 24 h
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          description: Identifiants invalides (réponse générique)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stockage des membres indisponible ou non configuré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ApiError'
  /auth/logout:
    post:
      operationId: logoutMember
      summary: Terminer la session courante (cookie)
      responses:
        '200':
          description: Session supprimée côté serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ApiError'
  /auth/me:
    get:
      operationId: currentMember
      summary: Session courante (membre, organisation, rôle, expiration)
      responses:
        '200':
          description: Session valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Session inconnue ou expirée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/keys:
    get:
      operationId: listAdminKeys
      summary: Lister les clés de l'organisation authentifiée
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clés de l'organisation (sans hash)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKeysResponse'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          description: Rôle insuffisant (viewer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registre persistant requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAdminKey
      summary: Générer une nouvelle clé pour l'organisation authentifiée (rôle au plus élevé du demandeur)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminKeyCreateRequest'
      responses:
        '201':
          description: Clé créée ; apiKey renvoyée une seule fois
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKeysResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /admin/keys/{keyId}:
    patch:
      operationId: patchAdminKey
      summary: Changer le rôle (owner uniquement) ou revokedAt (admin/owner) d'une clé de l'organisation
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminKeyPatchRequest'
      responses:
        '200':
          description: Clés à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKeysResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      operationId: revokeAdminKey
      summary: Révoquer immédiatement une clé de l'organisation
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Clé révoquée (revokedAt horodaté)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKeysResponse'
        '404':
          $ref: '#/components/responses/ApiError'
  /admin/organization:
    patch:
      operationId: patchAdminOrganization
      summary: Ajuster le quota de l'organisation authentifiée (owner uniquement)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrganizationPatchRequest'
      responses:
        '200':
          description: Clés avec le quota appliqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminKeysResponse'
        '403':
          $ref: '#/components/responses/ApiError'
  /identity/vies:
    post:
      operationId: checkVatIdentity
      summary: Vérifier ponctuellement un numéro de TVA auprès de VIES
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViesRequest'
      responses:
        '200':
          description: Résultat normalisé, y compris quand la source est indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '405':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /identity/peppol:
    post:
      operationId: checkPeppolIdentity
      summary: Rechercher exactement un participant dans Peppol Directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeppolRequest'
      responses:
        '200':
          description: Résultat normalisé, y compris quand la source est indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '405':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SettleMesh API key
      description: Clé sm_live_… générée pour une organisation. La clé brute n'est pas stockée côté serveur.
  responses:
    ApiError:
      description: Erreur structurée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [schema, apiVersion, status, validators, authentication, limits, persistence]
      properties:
        schema: { const: settlemesh-api-health }
        apiVersion: { const: v1 }
        status: { const: ok }
        validators:
          type: object
          required: [en16931, peppol]
          properties:
            en16931: { type: string }
            peppol: { type: string }
        authentication:
          type: object
          required: [validate, identity, configured, registry, supabase, members]
          properties:
            validate: { const: bearer-api-key }
            identity: { const: same-origin }
            configured: { type: boolean }
            registry:
              type: boolean
              description: true quand les clés sont chargées depuis le fichier de registre (SETTLEMESH_REGISTRY_FILE), false sinon.
            supabase:
              type: boolean
              description: true quand les clés sont chargées depuis la table public.settlemesh_registry d'un projet Supabase (SETTLEMESH_SUPABASE_*), lecture mise en cache 5 s.
            members:
              type: boolean
              description: true quand le stockage des membres humains est actif (tables Supabase settlemesh_members / settlemesh_sessions).
        limits:
          type: object
          properties:
            requestBytes: { type: integer }
            xmlBytes: { type: integer }
            ipRequestsPerMinute: { type: integer }
        persistence: { const: false }
    ViesRequest:
      type: object
      additionalProperties: false
      required: [countryCode, vatNumber]
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        vatNumber:
          type: string
          minLength: 2
          maxLength: 24
    PeppolRequest:
      type: object
      additionalProperties: false
      required: [participantId]
      properties:
        participantId:
          type: string
          pattern: '^(iso6523-actorid-upis::)?[0-9]{4}:[A-Za-z0-9][A-Za-z0-9._+/:.-]{1,79}$'
    IdentityResponse:
      type: object
      required: [schema, requestId, source, status, identifier, checkedAt, stored, message]
      properties:
        schema: { const: settlemesh-identity-check }
        requestId: { type: string, format: uuid }
        source: { enum: [VIES, Peppol Directory] }
        status: { enum: [verified, not_verified, unavailable] }
        identifier: { type: string }
        checkedAt: { type: string, format: date-time }
        stored: { const: false }
        legalName: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        countryCode: { type: [string, 'null'] }
        registeredOn: { type: [string, 'null'] }
        acceptedDocumentTypes: { type: integer, minimum: 0 }
        message: { type: string }
    ValidationRequest:
      type: object
      required: [xml]
      additionalProperties: false
      properties:
        xml:
          type: string
          minLength: 1
          description: Document UBL Invoice/CreditNote ou CII, 1 Mo maximum en UTF-8.
        profile:
          $ref: '#/components/schemas/Profile'
        source:
          type: object
          additionalProperties: false
          properties:
            originalFileName:
              type: string
              maxLength: 200
    Profile:
      type: object
      required: [companyName, legalName, vatId, acceptedFormats, acceptedCurrencies]
      properties:
        companyName: { type: string }
        legalName: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        vatId: { type: string }
        peppolId: { type: string }
        routingProvider: { type: string }
        acceptedFormats:
          type: array
          minItems: 1
          items: { enum: [UBL, CII, FACTUR-X] }
        acceptedCurrencies:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[A-Z]{3}$' }
        requirePurchaseOrder: { type: boolean }
        requireBuyerReference: { type: boolean }
        requireEndpoint: { type: boolean }
        requireAttachment: { type: boolean }
        submissionEmail: { type: string }
        instructions: { type: string }
    ValidationResponse:
      type: object
      required: [schema, apiVersion, requestId, processedAt, organizationId, organizationRole, stored, result]
      properties:
        schema: { const: settlemesh-validation-response }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        processedAt: { type: string, format: date-time }
        organizationId:
          type: string
          description: Organisation déterminée par la clé API authentifiée.
        organizationRole:
          type: string
          enum: [owner, admin, viewer]
          description: Rôle résolu côté serveur pour la clé authentifiée. Depuis une configuration SETTLEMESH_API_KEYS, le rôle implicite est owner.
        stored: { const: false }
        result:
          $ref: '#/components/schemas/ValidationResult'
    ValidationResult:
      type: object
      required: [id, checkedAt, checks, invoice, recipient, counts, score, outcome]
      properties:
        id: { type: string }
        checkedAt: { type: string, format: date-time }
        recipient: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        outcome: { enum: [ready, review, blocked] }
        counts:
          type: object
          properties:
            pass: { type: integer }
            error: { type: integer }
            warning: { type: integer }
            info: { type: integer }
        standards:
          type: object
          properties:
            en16931: { type: [string, 'null'] }
            peppol: { type: [string, 'null'] }
            officialFailures: { type: [integer, 'null'] }
            complete: { type: boolean }
        invoice:
          type: object
          description: Données structurées extraites, sans XML brut.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      required: [id, status, title, message, fix, field]
      properties:
        id: { type: string }
        status: { enum: [pass, error, warning, info] }
        title: { type: string }
        message: { type: string }
        fix: { type: string }
        field: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 256 }
    SessionResponse:
      type: object
      required: [schema, apiVersion, requestId]
      properties:
        schema: { const: settlemesh-session }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        organizationId: { type: string }
        member:
          type: object
          properties:
            email: { type: string }
            role: { enum: [owner, admin, viewer] }
        expiresAt: { type: string, format: date-time }
        terminated: { type: boolean }
    AdminKeysResponse:
      type: object
      required: [schema, apiVersion, requestId, organizationId, keys]
      properties:
        schema: { const: settlemesh-admin-keys }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        organizationId: { type: string }
        apiKey:
          type: string
          description: Renvoyée uniquement à la création (POST), une seule fois ; jamais stockée.
        notice: { type: string }
        keys:
          type: array
          items:
            $ref: '#/components/schemas/AdminKeyEntry'
    AdminKeyEntry:
      type: object
      required: [keyId, role, requestsPerMinute, revokedAt]
      properties:
        keyId: { type: string }
        role: { enum: [owner, admin, viewer] }
        requestsPerMinute: { type: integer, minimum: 1, maximum: 10000 }
        revokedAt: { type: [string, 'null'], format: date-time }
    AdminKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { enum: [viewer, admin, owner] }
        keyId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
          description: Généré si absent. Globalement unique dans le registre.
    AdminKeyPatchRequest:
      type: object
      additionalProperties: false
      properties:
        role: { enum: [owner, admin, viewer] }
        revokedAt: { type: [string, 'null'], format: date-time }
    AdminOrganizationPatchRequest:
      type: object
      additionalProperties: false
      required: [requestsPerMinute]
      properties:
        requestsPerMinute: { type: integer, minimum: 1, maximum: 10000 }
    ErrorResponse:
      type: object
      required: [schema, apiVersion, requestId, error]
      properties:
        schema: { const: settlemesh-api-error }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Codes observés : AUTH_NOT_CONFIGURED (503), AUTH_REQUIRED (401),
                INVALID_API_KEY (401), API_KEY_REVOKED (401, clé avec revokedAt
                dans le registre), FORBIDDEN_ROLE (403), ADMIN_REQUIRES_REGISTRY
                (409), KEY_NOT_FOUND (404), KEY_ID_UNAVAILABLE (409),
                INVALID_ADMIN_PAYLOAD (400), UNKNOWN_ADMIN_ROUTE (404),
                RATE_LIMITED et UPSTREAM_RATE_LIMITED (429), INVALID_JSON,
                INVALID_VAT_COUNTRY, INVALID_VAT_NUMBER, INVALID_PEPPOL_ID,
                IDENTITY_CHECK_FAILED, METHOD_NOT_ALLOWED, NOT_FOUND,
                BODY_TOO_LARGE, XML_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE,
                XML_REQUIRED, INVALID_XML, UNSAFE_XML, INVALID_PROFILE,
                VALIDATION_FAILED.
            message: { type: string }
