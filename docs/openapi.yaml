openapi: 3.1.0
info:
  title: SettleMesh Validation and Identity API
  version: 1.2.0-pilot
  description: >-
    API pilote authentifiée de prévalidation UBL/CII. Elle n'est pas une certification
    juridique, ne conserve pas les factures et nécessite encore une infrastructure de
    secrets, quotas et audit persistants avant une exposition Internet. Les routes
    d'identité VIES et Peppol ne persistent pas les identifiants ni leurs réponses.
servers:
  - url: http://127.0.0.1:4173/api/v1
    description: Serveur local
paths:
  /health:
    get:
      operationId: getHealth
      summary: État et versions des validateurs
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/ApiError'
  /validate:
    post:
      operationId: validateInvoice
      summary: Prévalider une facture XML UBL ou CII
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Facture analysée, même si le résultat métier est blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '405':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /identity/vies:
    post:
      operationId: checkVatIdentity
      summary: Vérifier ponctuellement un numéro de TVA auprès de VIES
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViesRequest'
      responses:
        '200':
          description: Résultat normalisé, y compris quand la source est indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '405':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
  /identity/peppol:
    post:
      operationId: checkPeppolIdentity
      summary: Rechercher exactement un participant dans Peppol Directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeppolRequest'
      responses:
        '200':
          description: Résultat normalisé, y compris quand la source est indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '405':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SettleMesh API key
      description: Clé sm_live_… générée pour une organisation. La clé brute n'est pas stockée côté serveur.
  responses:
    ApiError:
      description: Erreur structurée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [schema, apiVersion, status, validators, authentication, limits, persistence]
      properties:
        schema: { const: settlemesh-api-health }
        apiVersion: { const: v1 }
        status: { const: ok }
        validators:
          type: object
          required: [en16931, peppol]
          properties:
            en16931: { type: string }
            peppol: { type: string }
        authentication:
          type: object
          required: [validate, identity, configured]
          properties:
            validate: { const: bearer-api-key }
            identity: { const: same-origin }
            configured: { type: boolean }
        limits:
          type: object
          properties:
            requestBytes: { type: integer }
            xmlBytes: { type: integer }
            ipRequestsPerMinute: { type: integer }
        persistence: { const: false }
    ViesRequest:
      type: object
      additionalProperties: false
      required: [countryCode, vatNumber]
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        vatNumber:
          type: string
          minLength: 2
          maxLength: 24
    PeppolRequest:
      type: object
      additionalProperties: false
      required: [participantId]
      properties:
        participantId:
          type: string
          pattern: '^(iso6523-actorid-upis::)?[0-9]{4}:[A-Za-z0-9][A-Za-z0-9._+/:.-]{1,79}$'
    IdentityResponse:
      type: object
      required: [schema, requestId, source, status, identifier, checkedAt, stored, message]
      properties:
        schema: { const: settlemesh-identity-check }
        requestId: { type: string, format: uuid }
        source: { enum: [VIES, Peppol Directory] }
        status: { enum: [verified, not_verified, unavailable] }
        identifier: { type: string }
        checkedAt: { type: string, format: date-time }
        stored: { const: false }
        legalName: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        countryCode: { type: [string, 'null'] }
        registeredOn: { type: [string, 'null'] }
        acceptedDocumentTypes: { type: integer, minimum: 0 }
        message: { type: string }
    ValidationRequest:
      type: object
      required: [xml]
      additionalProperties: false
      properties:
        xml:
          type: string
          minLength: 1
          description: Document UBL Invoice/CreditNote ou CII, 1 Mo maximum en UTF-8.
        profile:
          $ref: '#/components/schemas/Profile'
        source:
          type: object
          additionalProperties: false
          properties:
            originalFileName:
              type: string
              maxLength: 200
    Profile:
      type: object
      required: [companyName, legalName, vatId, acceptedFormats, acceptedCurrencies]
      properties:
        companyName: { type: string }
        legalName: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        vatId: { type: string }
        peppolId: { type: string }
        routingProvider: { type: string }
        acceptedFormats:
          type: array
          minItems: 1
          items: { enum: [UBL, CII, FACTUR-X] }
        acceptedCurrencies:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[A-Z]{3}$' }
        requirePurchaseOrder: { type: boolean }
        requireBuyerReference: { type: boolean }
        requireEndpoint: { type: boolean }
        requireAttachment: { type: boolean }
        submissionEmail: { type: string }
        instructions: { type: string }
    ValidationResponse:
      type: object
      required: [schema, apiVersion, requestId, processedAt, organizationId, stored, result]
      properties:
        schema: { const: settlemesh-validation-response }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        processedAt: { type: string, format: date-time }
        organizationId:
          type: string
          description: Organisation déterminée par la clé API authentifiée.
        stored: { const: false }
        result:
          $ref: '#/components/schemas/ValidationResult'
    ValidationResult:
      type: object
      required: [id, checkedAt, checks, invoice, recipient, counts, score, outcome]
      properties:
        id: { type: string }
        checkedAt: { type: string, format: date-time }
        recipient: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        outcome: { enum: [ready, review, blocked] }
        counts:
          type: object
          properties:
            pass: { type: integer }
            error: { type: integer }
            warning: { type: integer }
            info: { type: integer }
        standards:
          type: object
          properties:
            en16931: { type: [string, 'null'] }
            peppol: { type: [string, 'null'] }
            officialFailures: { type: [integer, 'null'] }
            complete: { type: boolean }
        invoice:
          type: object
          description: Données structurées extraites, sans XML brut.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      required: [id, status, title, message, fix, field]
      properties:
        id: { type: string }
        status: { enum: [pass, error, warning, info] }
        title: { type: string }
        message: { type: string }
        fix: { type: string }
        field: { type: string }
    ErrorResponse:
      type: object
      required: [schema, apiVersion, requestId, error]
      properties:
        schema: { const: settlemesh-api-error }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
