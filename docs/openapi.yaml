openapi: 3.1.0
info:
  title: SettleMesh Validation API
  version: 1.0.0-pilot
  description: >-
    API pilote de prévalidation UBL/CII. Elle n'est pas une certification juridique,
    ne conserve pas les factures et ne doit pas être exposée sur Internet sans authentification.
servers:
  - url: http://127.0.0.1:4173/api/v1
    description: Serveur local
paths:
  /health:
    get:
      operationId: getHealth
      summary: État et versions des validateurs
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /validate:
    post:
      operationId: validateInvoice
      summary: Prévalider une facture XML UBL ou CII
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Facture analysée, même si le résultat métier est blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
components:
  responses:
    ApiError:
      description: Erreur structurée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [schema, apiVersion, status, validators, limits, persistence]
      properties:
        schema: { const: settlemesh-api-health }
        apiVersion: { const: v1 }
        status: { const: ok }
        validators:
          type: object
          required: [en16931, peppol]
          properties:
            en16931: { type: string }
            peppol: { type: string }
        limits:
          type: object
          properties:
            requestBytes: { type: integer }
            xmlBytes: { type: integer }
        persistence: { const: false }
    ValidationRequest:
      type: object
      required: [xml]
      additionalProperties: false
      properties:
        xml:
          type: string
          minLength: 1
          description: Document UBL Invoice/CreditNote ou CII, 1 Mo maximum en UTF-8.
        profile:
          $ref: '#/components/schemas/Profile'
        source:
          type: object
          additionalProperties: false
          properties:
            originalFileName:
              type: string
              maxLength: 200
    Profile:
      type: object
      required: [companyName, legalName, vatId, acceptedFormats, acceptedCurrencies]
      properties:
        companyName: { type: string }
        legalName: { type: string }
        country: { type: string, minLength: 2, maxLength: 2 }
        vatId: { type: string }
        peppolId: { type: string }
        routingProvider: { type: string }
        acceptedFormats:
          type: array
          minItems: 1
          items: { enum: [UBL, CII, FACTUR-X] }
        acceptedCurrencies:
          type: array
          minItems: 1
          items: { type: string, pattern: '^[A-Z]{3}$' }
        requirePurchaseOrder: { type: boolean }
        requireBuyerReference: { type: boolean }
        requireEndpoint: { type: boolean }
        requireAttachment: { type: boolean }
        submissionEmail: { type: string }
        instructions: { type: string }
    ValidationResponse:
      type: object
      required: [schema, apiVersion, requestId, processedAt, stored, result]
      properties:
        schema: { const: settlemesh-validation-response }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        processedAt: { type: string, format: date-time }
        stored: { const: false }
        result:
          $ref: '#/components/schemas/ValidationResult'
    ValidationResult:
      type: object
      required: [id, checkedAt, checks, invoice, recipient, counts, score, outcome]
      properties:
        id: { type: string }
        checkedAt: { type: string, format: date-time }
        recipient: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        outcome: { enum: [ready, review, blocked] }
        counts:
          type: object
          properties:
            pass: { type: integer }
            error: { type: integer }
            warning: { type: integer }
            info: { type: integer }
        standards:
          type: object
          properties:
            en16931: { type: [string, 'null'] }
            peppol: { type: [string, 'null'] }
            officialFailures: { type: [integer, 'null'] }
            complete: { type: boolean }
        invoice:
          type: object
          description: Données structurées extraites, sans XML brut.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      required: [id, status, title, message, fix, field]
      properties:
        id: { type: string }
        status: { enum: [pass, error, warning, info] }
        title: { type: string }
        message: { type: string }
        fix: { type: string }
        field: { type: string }
    ErrorResponse:
      type: object
      required: [schema, apiVersion, requestId, error]
      properties:
        schema: { const: settlemesh-api-error }
        apiVersion: { const: v1 }
        requestId: { type: string, format: uuid }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
